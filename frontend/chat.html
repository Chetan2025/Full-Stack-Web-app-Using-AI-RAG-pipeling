<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chatbot | RAG Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-shell">
        <div class="chat-panel">
            <div class="chat-header">
                <h2 id="chatTitle">Chatbot</h2>
                <div class="chat-header-actions">
                    <button id="themeToggle" class="btn secondary btn-inline" type="button" aria-label="Toggle theme">🌙 Dark</button>
                    <a class="btn secondary btn-inline" href="dashboard.html">Back</a>
                </div>
            </div>

            <div id="chatMessages" class="chat-body">
                <div class="empty-chat">Ask your first question.</div>
            </div>

            <div class="chat-entry">
                <input id="chatInput" type="text" placeholder="Type your question here..." autocomplete="off">
                <button id="sendChatBtn" class="btn" type="button">Send</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="chat.js"></script>
</body>
</html>
