<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Bot | RAG Builder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container upload-layout">

<div class="card">

<div class="card-topline">
<a href="dashboard.html">Back to dashboard</a>
<span class="pill">Protected</span>
</div>

<h1>Create Chatbot</h1>

<div id="statusMessage" class="status-message" style="display:none"></div>

<form id="createBotForm" novalidate>
    <p class="muted">Upload up to 3 documents. Supported flow: PDF, DOCX and TXT through the backend pipeline.</p>

    <div class="input-group">
        <label for="chatbotName">Chatbot Name</label>
        <input
            id="chatbotName"
            name="chatbot_name"
            type="text"
            maxlength="80"
            placeholder="Enter chatbot name"
            required
        >
    </div>

    <div class="input-group">
        <label for="files">Documents</label>
        <input
            multiple
            type="file"
            id="files"
            name="files"
            accept=".pdf,.docx,.txt"
            required
        >
    </div>

    <button
        id="createBotButton"
        class="btn"
        type="submit">
        Create Bot
    </button>
</form>

</div>

</div>

<script src="app.js"></script>
<script src="upload.js"></script>

</body>
</html>
